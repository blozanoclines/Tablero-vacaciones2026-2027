<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clines | Cobertura de vacaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FA852F; --star:#FFF112; --on-orange:#3B1E08;
  --paper:#F3F3F1; --surface:#FFFFFF; --ink:#1F2328; --muted:#62676E; --line:#DEDFDC; --brand:#1F2328;
  --ok:#2F9468; --warn:#D9A300; --crit:#C9302C; --none:#9AA5B1;
  --ok-bg:#E3F2EA; --warn-bg:#FBF3D2; --crit-bg:#F9DEDC; --none-bg:#E7EBEF;
  --vac:#3A78C2; --med:#8A55B5; --pres:#C3CCD6;
  --radius-l:14px; --radius-s:6px;
  --f-body:"Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17191C; --surface:#212428; --ink:#ECEDEE; --muted:#A2A7AD; --line:#33373C; --brand:#ECEDEE;
    --ok:#4CB886; --warn:#E8A936; --crit:#E8645A; --none:#6C7884;
    --ok-bg:#1C3329; --warn-bg:#3A2E15; --crit-bg:#3D1F1C; --none-bg:#25303B;
    --vac:#64A0E8; --med:#B38AD8; --pres:#3D4956; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#17191C; --surface:#212428; --ink:#ECEDEE; --muted:#A2A7AD; --line:#33373C; --brand:#ECEDEE;
  --ok:#4CB886; --warn:#E8A936; --crit:#E8645A; --none:#6C7884;
  --ok-bg:#1C3329; --warn-bg:#3A2E15; --crit-bg:#3D1F1C; --none-bg:#25303B;
  --vac:#64A0E8; --med:#B38AD8; --pres:#3D4956; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 64px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;line-height:1.15}


/* Encabezado de marca */
.hero{background:var(--orange);color:#fff;border-bottom:5px solid var(--star)}
.hero-in{max-width:1240px;margin:0 auto;padding:18px 20px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.brand{display:flex;align-items:stretch;gap:16px;flex:1 1 auto;min-width:0}
.logo-box{flex:none;position:relative;align-self:stretch;width:72px;background:#fff;border-radius:14px;box-shadow:0 2px 0 rgba(59,30,8,.18)}
.logo{position:absolute;inset:4px 6px;width:calc(100% - 12px);height:calc(100% - 8px);object-fit:contain}
.brand-txt{display:flex;flex-direction:column;justify-content:center}
.hero h1{line-height:1.05;font-size:clamp(1.55rem,3.4vw,2.3rem);font-weight:700;letter-spacing:-.005em;color:#fff;cursor:default;user-select:none}
.hero .stamp{color:var(--on-orange);font-weight:500;margin-top:4px;line-height:1.3}
.hero .search input{border-color:transparent;box-shadow:0 2px 0 rgba(59,30,8,.18)}
.hero .search svg{color:#62676E}
.hero .search input{color:#1F2328;background:#fff}
@media (max-width:640px){.logo-box{border-radius:10px}.hero .stamp .xtra{display:none}.brand{gap:12px}.hero-in{padding:14px 14px 16px}}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.top h1{font-size:clamp(1.6rem,3.6vw,2.2rem);letter-spacing:-.01em}
.stamp{color:var(--muted);font-size:.9rem;margin-top:2px}
.search{position:relative;flex:1 1 260px;max-width:400px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{color:var(--ink);position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -12px rgba(15,30,50,.35);overflow:hidden}
.results button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:10px 14px;border:0;background:none;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--paper)}
.results small{color:var(--muted)}
.results .empty{padding:12px 14px;color:var(--muted)}

/* Controles de período */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--surface)}
.datenav{display:inline-flex;align-items:center;gap:4px}
.datenav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.datenav .lbl{min-width:200px;text-align:center;font-family:var(--f-head);font-weight:600;font-size:1.1rem}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:500;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
#today{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;text-decoration:none;margin-left:4px}
#today:disabled{opacity:.45;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;color:var(--muted);font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--pres)}
.dot.vac{background:var(--vac)} .dot.med{background:var(--med)}

/* Zonas: franja por supervisor */
.zones{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:6px;margin-bottom:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:2px}
.zone{display:grid;grid-template-columns:minmax(120px,150px) 1fr auto;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;width:100%}
.zone:hover{background:var(--paper)}
.zone[aria-pressed="true"]{background:var(--paper);box-shadow:inset 4px 0 0 var(--orange)}
.zone .nm{font-weight:600;font-family:var(--f-head);font-size:1.02rem;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{width:13px;height:13px;border-radius:3px;background:var(--none)}
.chip.ok{background:var(--ok)} .chip.warn{background:var(--warn)} .chip.crit{background:var(--crit)}
.zone .out{color:var(--muted);font-size:.85rem;white-space:nowrap}
.zone.all .nm{color:var(--brand)}
.zone.all{grid-column:1/-1;grid-template-columns:minmax(120px,150px) 1fr auto}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.stack .ok{background:var(--ok)} .stack .warn{background:var(--warn)} .stack .crit{background:var(--crit)} .stack .none{background:var(--none)}
.zone .sum{display:flex;flex-direction:column;gap:6px}
.zone .sum small{color:var(--muted);font-size:.85rem}

/* Mosaico de servicios */
.group{margin-bottom:28px}
.group h2{font-size:1.25rem;margin:0 0 10px 2px;display:flex;align-items:baseline;gap:10px}
.group h2 small{font-family:var(--f-body);font-weight:400;font-size:.88rem;color:var(--muted)}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));grid-auto-flow:dense;gap:8px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid transparent;border-radius:var(--radius-l);padding:12px 12px 13px 15px;background:var(--surface);min-height:104px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st)}
.tile.ok{--st:var(--ok)} .tile.warn{--st:var(--warn);background:var(--warn-bg)} .tile.crit{--st:var(--crit);background:var(--crit-bg);border-color:var(--crit)} .tile.none{--st:var(--none);background:var(--none-bg)}
.tile.w2{grid-column:span 2} .tile.w3{grid-column:span 3}
.tile:hover{border-color:var(--st)}
.tile .tn{font-weight:600;font-size:.95rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:22px}
.tile .ppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tile .ppl .dot{width:10px;height:10px}
.tile .flag{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--st);color:#fff;font-weight:700;font-size:.8rem;line-height:1}
.emptystate{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--radius-l);border:1px dashed var(--line)}

/* Panel de detalle */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.on{transform:none}
@media (max-width:640px){.panel{top:auto;height:88%;width:100%;border-radius:18px 18px 0 0;transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.panel,.scrim{transition:none}}
.phead{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.phead h2{font-size:1.45rem}
.phead .sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.close{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pbody{overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:22px}
.state{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--bg)}
.state.ok{--bg:var(--ok-bg);--st:var(--ok)} .state.warn{--bg:var(--warn-bg);--st:var(--warn)} .state.crit{--bg:var(--crit-bg);--st:var(--crit)} .state.none{--bg:var(--none-bg);--st:var(--none)}
.state .big{font-family:var(--f-head);font-weight:700;font-size:1.25rem;color:var(--st)}
.state .ppl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.state .ppl .dot{width:12px;height:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.bars i{flex:1;min-width:3px;border-radius:3px 3px 0 0;background:var(--ok);min-height:3px}
.bars i.warn{background:var(--warn)} .bars i.crit{background:var(--crit)} .bars i.none{background:var(--none)} .bars i.zero{background:var(--line)}
.barslbl{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:4px}
.sect h3{font-size:1.05rem;margin-bottom:8px}
.note{padding:12px 14px;border-radius:10px;border:1px solid var(--warn);background:var(--warn-bg);font-size:.94rem}
.note.crit{border-color:var(--crit);background:var(--crit-bg)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alerts li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.alerts li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:.5em;background:var(--c,var(--warn))}
.alerts li.crit{--c:var(--crit)} .alerts li.info{--c:var(--none)}
.people{list-style:none;margin:0;padding:0}
.people li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.people .who{font-weight:500}
.people .who small{display:block;color:var(--muted);font-weight:400;font-size:.84rem}
.people .when{text-align:right;font-size:.88rem;color:var(--muted)}
.people button.who{border:0;background:none;padding:0;text-align:left}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--paper);color:var(--muted)}
.tag.vac{background:color-mix(in srgb,var(--vac) 18%,transparent);color:var(--vac)}
.tag.med{background:color-mix(in srgb,var(--med) 18%,transparent);color:var(--med)}
details summary{cursor:pointer;color:var(--brand);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* Estado de vacaciones por persona */
.tprog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:2px}
.tprog i{display:block;height:100%;background:var(--vac)}
.vsum{display:flex;align-items:center;gap:12px}
.vsum .tprog{flex:1;height:8px;border-radius:4px;margin:0}
.vsum b{font-family:var(--f-head);font-weight:700;font-size:1.15rem}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .who{border:0;background:none;padding:0;text-align:left;font-weight:500}
.vrow .det{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.vseg{display:flex;gap:2px;height:10px}
.vseg i{display:block;border-radius:3px;min-width:4px;box-sizing:border-box}
.vseg .d{background:var(--vac)}
.vseg .c{background:repeating-linear-gradient(135deg,var(--vac) 0 3px,color-mix(in srgb,var(--vac) 35%,transparent) 3px 6px)}
.vseg .f{border:1.5px dashed var(--muted)}
.vseg .u{border:1.5px dotted var(--line)}
.cap{color:var(--muted);font-size:.8rem;margin-top:3px}
.tag.curso{background:color-mix(in srgb,var(--vac) 18%,transparent);color:var(--vac)}
.tag.parcial{background:var(--warn-bg);color:color-mix(in srgb,var(--warn) 70%,var(--ink))}
.tag.okv{background:var(--ok-bg);color:var(--ok)}
.vleg{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.8rem;margin-top:8px}
.vleg span{display:inline-flex;align-items:center;gap:6px}
.vleg i{display:inline-block;width:14px;height:8px;border-radius:2px}

/* Administración */
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--brand);background:var(--paper)}
.drop strong{color:var(--ink)}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;background:var(--orange);color:var(--on-orange)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.diff{list-style:none;margin:0;padding:0;font-size:.92rem;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.diff li{padding:8px 12px;border-bottom:1px solid var(--line)}
.diff li:last-child{border-bottom:0}
.diff small{color:var(--muted)}
.count{font-family:var(--f-head);font-weight:700;font-size:1.6rem;line-height:1}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.counts div{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.counts div .count{color:var(--ink);display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;z-index:60;font-weight:500}
@media (max-width:640px){
  .wrap{padding:14px 14px 56px}
  .legend{margin-left:0}
  .datenav .lbl{min-width:0;flex:1;font-size:1rem}
  #today{padding:6px 10px;margin-left:2px}
  .zone.all{grid-template-columns:1fr auto}
  .zone.all .sum{grid-column:1/-1;order:3}
  .datenav{flex:1 1 100%;display:grid;grid-template-columns:36px minmax(0,1fr) 36px auto;width:100%}
  .mosaic{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .tile.w3{grid-column:span 2}
  .zone{grid-template-columns:110px 1fr auto}
}
</style>
</head>

const MES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

/* ============ Utilidades ============ */
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const normLeg = l => String(l ?? "").replace(/\D/g,"").replace(/^0+/,"") || "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (s,n) => { const d = fromIso(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const todayIso = () => { const t = new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); };
const fmtCorta = s => { if(!s) return "?"; const d = fromIso(s); return d.getUTCDate()+" "+MES_C[d.getUTCMonth()]; };
const fmtLarga = s => { const d = fromIso(s); return DIAS[d.getUTCDay()]+" "+d.getUTCDate()+" de "+MESES[d.getUTCMonth()]; };
const titleCase = s => String(s).toLowerCase().replace(/(^|[\s,(\/-])([a-zà-ÿñ])/g,(m,a,b)=>a+b.toUpperCase());
const nombreLindo = s => titleCase(s).replace(/\s+,/g,",");
const serialToIso = v => {
  if (typeof v === "number" && isFinite(v) && v > 20000) return iso(new Date(Math.round((v-25569)*86400000)));
  if (v instanceof Date && !isNaN(v)) return iso(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())));
  if (typeof v === "string") { const m = v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if (m){ const y = m[3].length===2 ? 2000+ +m[3] : +m[3]; return y+"-"+pad(m[2])+"-"+pad(m[1]); } }
  return null;
};

function categoria(sit){
  const k = norm(sit);
  if (!k) return null;
  if (/BAJA|EGRES|DESVINC|INACTIV/.test(k)) return "baja";
  return "med";
}
// Situación según la nómina: "Inactivo" en Estado NO es baja (incluye ART, licencias, reservas de puesto).
// Baja = no figura en la nómina, o figura "En proceso de baja". Ausente = ART, licencias, conflicto, reserva de puesto.
function categoriaNomina(sit, estado){
  const x = norm(sit), e = norm(estado);
  if (/BAJA|EGRES|DESVINC|DESPID|RENUNCI/.test(x) || /BAJA|EGRES|DESVINC/.test(e)) return "baja";
  if (/\bART\b|LICENC|\bLIC\b|ENFERM|MATERN|PATERN|CONFLICTO|RESERVA|SUSPEN|ACCIDENT/.test(x)) return "med";
  return "act";
}
const SIT_TXT = k => { const n = norm(k); if (n==="ART") return "ART"; if (/ENFERM/.test(n)) return "Licencia por enfermedad"; if (/GREMIAL/.test(n)) return "Licencia gremial"; if (/TEMPORADA/.test(n)) return "Reserva de puesto (temporada)"; if (/RESERVA/.test(n)) return "Reserva de puesto"; if (/MATERN/.test(n)) return "Licencia por maternidad"; if (/CONFLICTO/.test(n)) return "En conflicto"; if (/PROGRAMADA/.test(n)) return "Baja programada"; if (/PROCESO/.test(n)) return "En proceso de baja"; if (/BAJA/.test(n)) return "Baja"; return titleCase(k); };

let M; // modelo derivado
function derive(){
  const svcByKey = new Map();
  DB.servicios.forEach(s => svcByKey.set(norm(s.n), {n:s.n, sup:s.sup}));
  const zonaKeys = new Set(DB.zona.map(norm));
  const excl = new Set((DB.excluir||[]).map(norm));
  const supZona = new Set(DB.supZona);
  // servicios del listado de supervisores cuya persona a cargo es de la zona también entran
  DB.servicios.forEach(s => { const k = norm(s.n); if (s.sup && supZona.has(s.sup) && !excl.has(k)) zonaKeys.add(k); });
  const listado = DB.listado; // {leg:{s,e,n}} o null
  const rawName = new Map(); DB.zona.forEach(z => rawName.set(norm(z), z));
  const services = new Map();
  const ensure = k => {
    if (!services.has(k)) { const info = svcByKey.get(k); services.set(k, {k, n: info ? info.n : (rawName.get(k) || k), sup: info && info.sup ? info.sup : "", emps:[]}); }
    return services.get(k);
  };
  zonaKeys.forEach(ensure);
  const emps = [];
  for (const e of DB.planif){
    const lg = normLeg(e.l);
    let svc = e.s, cat = categoria(e.x), sit = e.x, revisar = false, movido = false;
    if (listado){
      const L = listado[lg];
      if (L){ if (L.s && norm(L.s) !== norm(svc)) { svc = L.s; movido = true; }
              if (L.x !== undefined) {           // nómina con columna Situación: manda sobre la planificación
                const c2 = categoriaNomina(L.x, L.e);
                cat = c2 === "act" ? null : c2; sit = c2 === "act" ? "" : (L.x || L.e);
              } else if (L.e && categoriaNomina("", L.e) === "baja") { cat = "baja"; sit = sit || L.e; } }
      else revisar = true;
    }
    const k = norm(svc);
    if (!zonaKeys.has(k)) continue;
    const per = [], malas = [];
    (e.p||[]).forEach(([a,b]) => { if (a && b && b >= a) per.push([a,b]); else malas.push([a,b]); });
    const asign = per.reduce((t,[a,b]) => t + (fromIso(b)-fromIso(a))/864e5 + 1, 0);
    const emp = {l:e.l, lg, n:e.n, k, d:e.d, per, malas, sit, cat: cat || "act", revisar, movido, asign};
    emps.push(emp); ensure(k).emps.push(emp);
  }
  const sups = [...new Set([...services.values()].map(s => s.sup))].sort((a,b) => (a===""?1:0)-(b===""?1:0) || a.localeCompare(b));
  M = {services, emps, sups};
}

/* ============ Cálculo de estado ============ */
function absType(emp, day){
  if (emp.cat === "med") return "med";
  for (const [a,b] of emp.per) if (day >= a && day <= b) return "vac";
  return null;
}
function dayStatus(svc, day){
  let dot = 0, vac = 0, med = 0;
  for (const e of svc.emps){ if (e.cat === "baja") continue; dot++; const t = absType(e, day); if (t==="vac") vac++; else if (t==="med") med++; }
  const abs = vac + med;
  let st;
  if (dot === 0) st = "none";
  else if (dot <= SERVICIO_CHICO) st = abs === 0 ? "ok" : abs >= dot ? "crit" : "warn";
  else { const p = abs/dot; st = p > UMBRAL_CRITICO ? "crit" : p >= UMBRAL_ATENCION ? "warn" : "ok"; }
  return {day, dot, vac, med, abs, st};
}
function rangeDays(r){ const out = []; for (let d = r.a; d <= r.b; d = addDays(d,1)) out.push(d); return out; }
function evalService(svc, r){
  const days = rangeDays(r).map(d => dayStatus(svc, d));
  let worst = days[0];
  days.forEach(x => { if (RANK[x.st] > RANK[worst.st] || (x.st === worst.st && x.abs > worst.abs)) worst = x; });
  const people = svc.emps.filter(e => e.cat !== "baja").map(e => {
    let t = null; if (e.cat === "med") t = "med"; else for (const d of days) if (absType(e, d.day)) { t = "vac"; break; }
    return {e, t};
  }).sort((x,y) => (x.t?0:1)-(y.t?0:1) || (x.t==="med"?0:1)-(y.t==="med"?0:1));
  return {svc, days, worst, st: worst.st, people};
}

/* ============ Estado de vacaciones respecto de hoy (fecha del dispositivo) ============ */
const diasEntre = (a,b) => Math.round((fromIso(b)-fromIso(a))/864e5) + 1;
function estadoVac(e, hoy){
  if (e.cat === "baja") return {k:"baja", rank:9};
  if (e.cat === "med") return {k:"med", rank:8, total:e.d, disf:0};
  const per = e.per.slice().sort((x,y) => x[0] < y[0] ? -1 : 1);
  let disf = 0, cur = null; const fut = [], done = [];
  per.forEach(p => { if (p[1] < hoy) { done.push(p); disf += diasEntre(p[0],p[1]); }
                     else if (p[0] <= hoy) { cur = p; disf += diasEntre(p[0],hoy); }
                     else fut.push(p); });
  const total = Math.max(e.d || 0, e.asign || 0), sinAsignar = Math.max(0, (e.d||0) - (e.asign||0));
  const segs = per.map(p => ({t: p[1] < hoy ? "d" : p[0] <= hoy ? "c" : "f", n: diasEntre(p[0],p[1])}));
  if (sinAsignar) segs.push({t:"u", n:sinAsignar});
  const next = fut[0] || null;
  let k, rank;
  if (cur) { k = "curso"; rank = 0; }
  else if (!per.length) { k = "sinplan"; rank = 6; }
  else if (!fut.length) { k = sinAsignar ? "faltan" : "completo"; rank = sinAsignar ? 5 : 7; }
  else if (done.length) { k = "parcial"; rank = 1; }
  else { k = "nosalio"; rank = 2; }
  return {k, rank, disf, total, sinAsignar, cur, next, done, fut, segs};
}
function vacTag(s, e){
  const fecha = p => fmtCorta(p[0])+" al "+fmtCorta(p[1]);
  const prox = s.next ? (s.next[0] === addDays(todayIso(),1) ? "mañana" : "el "+fmtCorta(s.next[0])) : "";
  switch (s.k) {
    case "curso": return {tag:`<span class="tag curso">De vacaciones</span>`, det:`hasta el ${fmtCorta(s.cur[1])}${s.fut.length ? `, luego le ${s.fut.length === 1 ? "queda 1 período" : "quedan "+s.fut.length+" períodos"}` : ""}`, cap: s.next ? "Próximo: "+fecha(s.next) : "Último período"};
    case "parcial": return {tag:`<span class="tag parcial">Disfrutó ${s.done.length} de ${s.done.length+s.fut.length}</span>`, det:`${s.disf} de ${s.total} días`, cap:`Próximo: ${fecha(s.next)}${prox === "mañana" ? ", mañana" : ""}`};
    case "nosalio": return {tag:`<span class="tag">Aún no salió</span>`, det:`${s.total} días por disfrutar`, cap:`Primer período: ${fecha(s.next)}`};
    case "completo": return {tag:`<span class="tag okv">Completó</span>`, det:`${s.disf} de ${s.total} días`, cap:`Terminó el ${fmtCorta(s.done[s.done.length-1][1])}`};
    case "faltan": return {tag:`<span class="tag parcial">Faltan días</span>`, det:`disfrutó ${s.disf}, le faltan asignar ${s.sinAsignar}`, cap:"Sin próximo período cargado"};
    case "sinplan": return {tag:`<span class="tag">Sin fechas</span>`, det:`${e.d} días sin planificar`, cap:""};
    case "med": return {tag:`<span class="tag med">${esc(SIT_TXT(e.sit))}</span>`, det:"no puede tomar vacaciones por ahora", cap:""};
    default: return {tag:`<span class="tag">${esc(SIT_TXT(e.sit))}</span>`, det:"no se cuenta en la dotación", cap:""};
  }
}
function segHtml(s){
  if (!s.segs || !s.segs.length) return "";
  return `<div class="vseg">${s.segs.map(g => `<i class="${g.t}" style="flex:${g.n}"></i>`).join("")}</div>`;
}
function avanceServicio(svc, hoy){
  let disf = 0, total = 0;
  svc.emps.forEach(e => { if (e.cat === "baja") return; const s = estadoVac(e, hoy); disf += s.disf || 0; total += s.total || 0; });
  return {disf, total, pct: total ? Math.round(100*disf/total) : 0};

function findHeader(rows, test){
  for (let i = 0; i < Math.min(rows.length, 25); i++){ const h = rows[i].map(norm); if (test(h)) return i; }

async function handleFile(f){
  const pv = $("preview"); pv.innerHTML = `<p style="color:var(--muted);margin:0">Leyendo ${esc(f.name)}…</p>`;
  try {
    const X = await loadXLSX();
    const wb = X.read(await f.arrayBuffer(), {type:"array", raw:true});
    let found = null;
    for (const name of wb.SheetNames){
      const rows = X.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null, blankrows:false});
      let i = findHeader(rows, h => h.includes("LEGAJO") && h.some(c => /INICIO.*PERIODO/.test(c)));
      if (i >= 0){ found = {tipo:"planif", rows, i, name}; break; }
      i = findHeader(rows, h => h.some(c => /LEGAJO/.test(c)) && h.some(c => /DESTINO|SERVICIO|OBJETIVO/.test(c)));
      if (i >= 0 && !found){ found = {tipo:"listado", rows, i, name}; continue; }
      i = findHeader(rows, h => h.includes("SERVICIO") && h.includes("SUPERVISOR"));
      if (i >= 0 && !found) found = {tipo:"servicios", rows, i, name};
    }
    if (!found) throw new Error("No reconozco el archivo. Necesita una fila de encabezados con Legajo y Destino (listado actual), con Legajo e Inicio Período (planificación) o con Servicio y Supervisor.");
    ({planif: previewPlanif, listado: previewListado, servicios: previewServicios})[found.tipo](found, f.name);
  } catch(err){ pv.innerHTML = `<div class="note crit">${esc(err.message)}</div>`; }
}

    nuevos.forEach(e => copia.push(e));
    return copia; }};
  $("preview").innerHTML = `<p style="margin:0">Archivo reconocido como <strong>planificación de vacaciones</strong> (${esc(fname)}, hoja "${esc(F.name)}"). Se compara legajo por legajo y solo se actualizan las fechas, la situación y los días. Los destinos no se modifican.</p>
    <div class="counts"><div><span class="count">${cambios.length}</span>legajos con cambios</div><div><span class="count">${zonaCount}</span>de ellos en tu zona</div><div><span class="count">${nuevos.length}</span>legajos nuevos, se agregan</div><div><span class="count">${sinCambio}</span>sin cambios</div></div>
    ${cambios.length ? `<div class="sect"><h3>Cambios a aplicar</h3><ul class="diff">${cambios.map(detalle).join("")}</ul></div>` : `<p style="margin:0">No hay cambios de fechas respecto de lo cargado.</p>`}
    ${nuevos.length ? `<div class="sect"><h3>Legajos nuevos</h3><ul class="diff">${nuevos.map(e => `<li>${esc(nombreLindo(e.n))} <small>(${esc(e.l)}, ${esc(e.s || "sin servicio")})</small><br><small>${esc(e.x ? SIT_TXT(e.x) : fmtP(e.p))}</small></li>`).join("")}</ul></div>` : ""}
    <div class="btnrow">${cambios.length || nuevos.length ? `<button class="btn" id="apply">Aplicar cambios</button>` : ""}<button class="btn ghost" id="discard">Descartar</button></div>`;
  wireApply();
}
function previewServicios(F, fname){
  const h = F.rows[F.i].map(norm); const cS = h.indexOf("SERVICIO"), cP = h.indexOf("SUPERVISOR");
  const out = []; F.rows.slice(F.i+1).forEach(r => { const s = String(r[cS] ?? "").replace(/\s+/g," ").trim(); if (s) out.push({n:s, sup: r[cP] ? titleCase(String(r[cP]).trim()) : ""}); });
  const old = new Map(DB.servicios.map(s => [norm(s.n), s.sup]));
  const nuevos = out.filter(s => !old.has(norm(s.n))), cambian = out.filter(s => old.has(norm(s.n)) && old.get(norm(s.n)) !== s.sup);
  const quitados = DB.servicios.filter(s => !out.some(o => norm(o.n) === norm(s.n)));
  pending = {tipo: "servicios", resumen: `${nuevos.length} servicios nuevos, ${cambian.length} cambian de supervisor, ${quitados.length} ya no figuran`, payload: () => out};
  const list = (t, arr) => arr.length ? `<div class="sect"><h3>${t}</h3><ul class="diff">${arr.join("")}</ul></div>` : "";
  $("preview").innerHTML = `<p style="margin:0">Archivo reconocido como <strong>servicios y supervisores</strong> (${esc(fname)}, ${out.length} servicios).</p>
    ${list("Servicios nuevos", nuevos.map(s => `<li>${esc(s.n)} <small>${esc(s.sup || "sin supervisor")}</small></li>`))}
    ${list("Cambian de supervisor", cambian.map(s => `<li>${esc(s.n)} <small>${esc(old.get(norm(s.n)) || "sin supervisor")} pasa a ${esc(s.sup || "sin supervisor")}</small></li>`))}
    ${list("Ya no figuran", quitados.map(s => `<li>${esc(s.n)}</li>`))}
    ${!nuevos.length && !cambian.length && !quitados.length ? `<p style="margin:0">No hay diferencias con el listado actual.</p>` : ""}
    <div class="btnrow"><button class="btn" id="apply">Aplicar cambios</button><button class="btn ghost" id="discard">Descartar</button></div>`;
  wireApply();
}
function wireApply(){
  if ($("apply")) $("apply").onclick = async () => {
    const btn = $("apply"), clave = ($("clave").value || "").trim();
    const err = msg => { let n = $("applyerr"); if (!n) { n = document.createElement("div"); n.id = "applyerr"; n.className = "note crit"; btn.parentNode.before(n); } n.textContent = msg; };
    if (!clave) { err("Escribí la clave de administración arriba para guardar los cambios."); $("clave").focus(); return; }
    if (!pending) return;
    btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const j = await srv("guardar", clave, pending.tipo, JSON.stringify(pending.payload()), pending.resumen);
      CLAVE = clave; pending = null; DB = JSON.parse(j); ultimaCarga = Date.now(); derive(); render(); closePanel(); toast("Cambios guardados");
    } catch(e) { err(e.message); btn.disabled = false; btn.textContent = "Aplicar cambios"; }
  };
  $("discard").onclick = () => { pending = null; $("preview").innerHTML = ""; $("file").value = ""; };
}
function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ============ Eventos ============ */
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { V.mode = b.dataset.mode; render(); });
$("prev").onclick = () => shift(-1); $("next").onclick = () => shift(1);
$("today").onclick = () => { V.date = todayIso(); render(); };
$("pclose").onclick = closePanel; $("scrim").onclick = closePanel;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePanel(); $("results").hidden = true; }
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) { e.preventDefault(); openAdmin(); }
});
$("q").addEventListener("input", e => search(e.target.value));
$("q").addEventListener("focus", e => search(e.target.value));
document.addEventListener("click", e => {
  const t = e.target.closest("[data-svc],[data-leg]");
  if (t){ $("results").hidden = true; if (t.closest("#results")) $("q").value = "";
    if (t.dataset.svc) openService(t.dataset.svc); else openPerson(t.dataset.leg); return; }
  if (!e.target.closest(".search")) $("results").hidden = true;
});
// Acceso oculto: triple clic en el título, Ctrl+Shift+A o #admin en el enlace
let clicks = 0, clickT; $("title").addEventListener("click", () => { clicks++; clearTimeout(clickT); clickT = setTimeout(() => clicks = 0, 600); if (clicks >= 3) { clicks = 0; openAdmin(); } });
// El logo toma la altura exacta del bloque de título y fecha
(function(){ const box = document.querySelector(".logo-box"), txt = document.querySelector(".brand-txt");
  const fit = () => { box.style.width = Math.round(txt.getBoundingClientRect().height * 1.22) + "px"; };
  fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(txt); else addEventListener("resize", fit); })();
// Carga inicial, apertura del panel con ?admin en el enlace y refresco periódico
cargar().then(() => {
  if (window.google && google.script && google.script.url)
    google.script.url.getLocation(loc => { if (loc && loc.parameter && "admin" in loc.parameter) openAdmin(); });
  else if (new URLSearchParams(location.search).has("admin") || location.hash === "#admin") openAdmin();
});
setInterval(() => { if (!document.hidden && !$("panel").classList.contains("on")) cargar(true); }, 10*60*1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - ultimaCarga > 5*60*1000 && !$("panel").classList.contains("on")) cargar(true); });
</script>
